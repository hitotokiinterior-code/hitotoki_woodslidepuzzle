workflows:
  ios-capacitor-workflow:
    name: 木箱すべりパズル iOS (Capacitor)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
      node: latest
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.hitotoki.woodslidepuzzle" # must match capacitor.config.ts appId
        # AdMob's "App ID" (NOT an ad unit ID) — from AdMob > アプリ設定.
        # Set the real value in Codemagic's UI: Environment variables, not here,
        # so it's not sitting in plain text in the repo.
        ADMOB_APP_ID: "ca-app-pub-4044413836429156~5152450361" # 木箱すべりパズル の本番AdMobアプリID
      groups:
        # Create this group in Codemagic's UI (Teams > Environment variables)
        # and add your App Store Connect API key there (see README.md).
        - app_store_credentials
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Add iOS platform (first run only — safe to re-run)
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Inject AdMob App ID + ATT text into Info.plist
        # No Xcode needed on your side for this — PlistBuddy is preinstalled
        # on Codemagic's macOS build machines, and this runs every build
        # since ios/App/App/Info.plist is regenerated by `cap add ios` above.
        script: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :GADApplicationIdentifier" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :GADApplicationIdentifier string $ADMOB_APP_ID" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSUserTrackingUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSUserTrackingUsageDescription string 広告をあなたに合わせて表示するために使用します。" "$PLIST"
      - name: Install CocoaPods
        script: cd ios/App && pod install
      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain initialize
          app-store-connect list-builds --app-id "$BUNDLE_ID" || true
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd $CM_BUILD_DIR/ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID" || echo 0)
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        # Name of the App Store Connect API key you add in Codemagic's UI
        # under Teams > Integrations > App Store Connect (see README.md).
        api_key: codemagic_api_key
        submit_to_testflight: true
        # Flip to true once you're ready to send builds straight to review.
        submit_to_app_store: false
