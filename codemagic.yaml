workflows:
  ios-capacitor-workflow:
    name: 木箱すべりパズル iOS (Capacitor)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      node: latest
      vars:
        # Capacitor 8 uses Swift Package Manager for plugins that support it
        # (like @capacitor-community/admob), so there's no Podfile/.xcworkspace
        # — we build the .xcodeproj directly instead.
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.hitotoki.woodslidepuzzle" # must match capacitor.config.ts appId
        # AdMob's "App ID" (NOT an ad unit ID) — from AdMob > アプリ設定.
        # Set the real value in Codemagic's UI: Environment variables, not here,
        # so it's not sitting in plain text in the repo.
        ADMOB_APP_ID: "ca-app-pub-4044413836429156~5152450361" # 木箱すべりパズル の本番AdMobアプリID
      groups:
        # Create this group in Codemagic's UI (Teams > Environment variables)
        # and add your App Store Connect API key there (see README.md).
        - app_store_credentials
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Add iOS platform
        script: |
          set -e
          rm -rf ios  # Codemagic clones fresh each build, so always regenerate cleanly
          npx cap add ios
          echo "---- ios/App contents ----"
          ls -la ios/App
          if [ ! -d "ios/App/App.xcodeproj" ]; then
            echo "ERROR: App.xcodeproj was not generated by 'cap add ios'. Aborting."
            exit 1
          fi
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Inject AdMob App ID + ATT text into Info.plist
        # No Xcode needed on your side for this — PlistBuddy is preinstalled
        # on Codemagic's macOS build machines, and this runs every build
        # since ios/App/App/Info.plist is regenerated by `cap add ios` above.
        script: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :GADApplicationIdentifier" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :GADApplicationIdentifier string $ADMOB_APP_ID" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSUserTrackingUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSUserTrackingUsageDescription string 広告をあなたに合わせて表示するために使用します。" "$PLIST"
      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain initialize
          app-store-connect list-builds --app-id "$BUNDLE_ID" || true
          # Explicitly point at our .xcodeproj — without --project, this
          # sometimes fails to locate/apply the profile when there's no
          # .xcworkspace (SPM-only projects), leaving signing unconfigured.
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Increment build number
        script: |
          cd $CM_BUILD_DIR/ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID" || echo 0)
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        # These three come from the .p8 key / Key ID / Issuer ID you got when
        # generating the App Store Connect API key — stored as secret
        # environment variables in the `app_store_credentials` group above
        # (see README.md for exact variable names to create in Codemagic's UI).
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        # Flip to true once you're ready to send builds straight to review.
        submit_to_app_store: false
