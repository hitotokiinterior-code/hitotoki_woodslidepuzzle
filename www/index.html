<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>木箱すべりパズル</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="titleScreen">
  <img class="bgimg" src="img/bg.jpg" alt="木箱すべりパズル ホーム">
  <div class="brand">
    <div class="mark"><img src="img/mark.png" alt=""></div>
    <div class="wordmark"><img src="img/wordmark.png" alt="hitotoki"></div>
    <div class="subline">WOOD SLIDE</div>
  </div>
  <div class="tapstart">タップしてスタート</div>
</div>
<div id="levelSelect">
  <div class="plaque">
    <div class="screw tl"></div><div class="screw tr"></div><div class="screw bl"></div><div class="screw br"></div>
    <div class="plaqueHead">
      <button class="roundBtn" id="backHomeBtn">←</button>
      <div class="plaqueTitle">LEVEL SELECT</div>
      <button class="roundBtn" id="soundBtn">⚙</button>
    </div>
    <div class="lvGrid" id="lvGrid"></div>
    <div class="pageNav">
      <button class="roundBtn" id="prevPageBtn">‹</button>
      <div class="pageLabel" id="pageLabel"></div>
      <button class="roundBtn" id="nextPageBtn">›</button>
    </div>
  </div>
</div>
<div id="gameScreen">
  <div class="hud">
    <div class="hudTop"><span id="lvTitle"></span><span id="stageNo"></span></div>
    <div class="hudStats"><div><small>現在の手数</small><b id="moves">00</b></div><i></i><div><small>最小手数</small><b id="parN">00</b></div></div>
  </div>
  <div id="board"></div>
  <p class="cap">木箱を動かして、娘を出口へ導こう。</p>
  <div class="hintMsg" id="hintMsg"></div>
  <div class="controls">
    <button class="wbtn" id="undoBtn"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>ひとつ戻す</button>
    <button class="wbtn" id="hintBtn"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>ヒント</button>
    <button class="wbtn" id="resetBtn"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.7-6"/><path d="M20 4v5h-5"/></svg>やり直す</button>
  </div>
  <div class="navRow">
    <button class="wbtn homeBtn" id="homeBtn"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>ホーム</button>
    <button class="lsLink" id="backBtn">LEVEL SELECT <span>›</span></button>
  </div>
</div>
<div id="win"><div class="card" id="winCard">
  <div class="crown">👑</div>
  <h2>CLEAR</h2>
  <div class="winStars" id="winStars"><span>★</span><span>★</span><span>★</span></div>
  <div id="newBestTag" class="newbest" style="display:none">NEW BEST!</div>
  <div class="statbox">
    <div class="stat"><div class="n" id="statMoves"></div><div class="l">今回の手数</div></div>
    <div class="stat"><div class="n" id="statBest"></div><div class="l">ベスト</div></div>
  </div>
  <p class="sub2" id="statPar"></p>
  <div class="winbtns"><button class="act" id="retryBtn">もう一度</button><button class="act" id="nextBtn">次のレベル</button></div>
  <div style="margin-top:8px"><button class="act ghost" id="toListBtn">レベル選択へ</button></div>
</div></div>
<script src="ads.js"></script>
<script src="levels.js"></script>
<script src="solver.js"></script>
<script src="game.js"></script>
</body>
</html>
