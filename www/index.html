h1{font-size:1.15rem;margin:4px 0 0;letter-spacing:.04em}
.sub{font-size:.8rem;opacity:.9;margin:0;text-align:center;color:#fff8ea;text-shadow:0 2px 6px rgba(0,0,0,.55)}
.stats{color:#fff8ea;text-shadow:0 2px 6px rgba(0,0,0,.55)}
#titleScreen{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;margin:0;padding:0;overflow:hidden;cursor:pointer;z-index:20}
#titleScreen .bgimg{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;display:block;margin:0}
#titleScreen .tapstart{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff8ea;
 font-size:clamp(.75rem,4.2vw,1rem);letter-spacing:.14em;text-shadow:0 2px 10px rgba(0,0,0,.6);
 white-space:nowrap;animation:fadeloop 3.2s ease-in-out infinite}
@keyframes fadeloop{0%,100%{opacity:0}50%{opacity:1}}
#titleScreen .brand{position:absolute;left:50%;top:16.5%;transform:translateX(-50%);text-align:center;
 color:#fff8ea;text-shadow:0 2px 10px rgba(0,0,0,.45);width:100%}
#titleScreen .mark{width:clamp(64px,17vw,96px);margin:0 auto .6vh;filter:drop-shadow(0 2px 8px rgba(0,0,0,.4))}
#titleScreen .mark img{width:100%;display:block}
#titleScreen .wordmark{width:clamp(170px,46vw,270px);margin:0 auto;filter:drop-shadow(0 2px 8px rgba(0,0,0,.4))}
#titleScreen .wordmark img{width:100%;display:block}
#titleScreen .subline{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(.8rem,3.2vw,1.05rem);
 letter-spacing:.28em;margin-top:1.2vh;opacity:.95}
#titleScreen .subline::before,#titleScreen .subline::after{content:"—";margin:0 .4em;opacity:.8}
#levelSelect{display:none;flex-direction:column;align-items:center;width:100%;max-width:360px}
.plaque{position:relative;width:100%;box-sizing:border-box;border-radius:20px;padding:18px 16px 20px;
 background:var(--grain),linear-gradient(165deg,#5c4326,#3a2a18);
 box-shadow:0 0 0 3px #2a1e10,0 0 0 5px #7a5630,0 14px 30px rgba(0,0,0,.4);color:#fff8ea}
.plaque .screw{position:absolute;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e0c48a,#5c4326 70%);opacity:.8}
.plaque .screw.tl{top:10px;left:10px}.plaque .screw.tr{top:10px;right:10px}
.plaque .screw.bl{bottom:10px;left:10px}.plaque .screw.br{bottom:10px;right:10px}
.plaqueHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.roundBtn{width:42px;height:42px;border-radius:50%;border:1.5px solid rgba(255,232,190,.55);background:linear-gradient(160deg,var(--wl),var(--wd));
 color:#fff8ea;font-size:1.1rem;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.4);flex:none}
.roundBtn:active{transform:translateY(1px)}
.plaqueTitle{font-size:1.02rem;font-weight:700;letter-spacing:.14em;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.lvGrid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:82px;align-content:start;gap:10px;width:100%;min-height:358px}
.lvCard{height:82px;box-sizing:border-box;border-radius:12px;padding:8px 4px 7px;text-align:center;cursor:pointer;color:#fff8ea;
 border:1.5px solid rgba(255,225,170,.35);
 box-shadow:inset 0 0 0 1px rgba(0,0,0,.3),0 3px 0 rgba(0,0,0,.4);
 background:var(--grain),linear-gradient(160deg,#6b4d2c,#3f2c18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.lvCard:active{transform:translateY(2px)}
.lvnum{font-size:1.15rem;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.lvstars{font-size:.72rem;letter-spacing:1px;color:#4a3a28}
.lvstars .on{color:#f4c85a;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.pageNav{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:14px}
.pageNav .pageLabel{font-size:.8rem;letter-spacing:.08em;min-width:38px;text-align:center;opacity:.9}
.pageNav .roundBtn.hide{visibility:hidden}
#gameScreen{display:none;flex-direction:column;align-items:center;gap:12px}
#board{position:relative;width:280px;height:350px;border-radius:10px;touch-action:none;
 background:var(--grain),repeating-linear-gradient(90deg,#4a3620 0 2px,transparent 2px 70px),linear-gradient(160deg,#3a2a18,#2a1e10);
 box-shadow:inset 0 0 0 4px #2a1e10,0 0 0 6px #7a5630,0 0 0 8px #4a3620,0 10px 20px rgba(0,0,0,.3)}
.exit{position:absolute;background:#efe3c8;box-shadow:inset 0 3px 6px rgba(0,0,0,.25)}
.exit.side-D{bottom:-14px;height:16px;border-radius:0 0 8px 8px}
.exit.side-U{top:-14px;height:16px;border-radius:8px 8px 0 0}
.exit.side-L{left:-14px;width:16px;border-radius:8px 0 0 8px}
.exit.side-R{right:-14px;width:16px;border-radius:0 8px 8px 0}
.piece{position:absolute;border-radius:8px;cursor:grab;touch-action:none;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:700;color:#fff8ea;
 --a:#c99a5b;--b:#8a6238;
 background:var(--grain),repeating-linear-gradient(100deg,rgba(0,0,0,.06) 0 3px,transparent 3px 9px),linear-gradient(160deg,var(--a),var(--b));
 box-shadow:0 3px 0 rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.22),inset 0 -2px 0 rgba(0,0,0,.2);
 transition:left .14s ease,top .14s ease,transform .1s,box-shadow .1s}
.piece::after{content:"";position:absolute;inset:5px;border-radius:5px;border:1.5px solid rgba(60,35,10,.28);pointer-events:none}
.piece[data-k=s]{--a:#d8ae72;--b:#a0713f}.piece[data-k=h]{--a:#bd8a4e;--b:#7d5430}.piece[data-k=v]{--a:#c4925a;--b:#84582f}
.piece[data-k=t]{--a:#e6a67a;--b:#b0503a;text-shadow:0 1px 2px rgba(0,0,0,.35);font-size:1.4rem}
.piece.drag{transition:none;transform:scale(1.04);z-index:5;cursor:grabbing;box-shadow:0 8px 12px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.22)}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button.act{border:none;border-radius:999px;padding:9px 18px;font-size:.85rem;background:var(--wm);color:#fff8ea;box-shadow:0 3px 0 var(--wd)}
button.act:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wd)}
button.ghost{background:transparent;color:#fff8ea;box-shadow:none;text-decoration:underline;padding:9px 6px;text-shadow:0 2px 6px rgba(0,0,0,.5)}
#win{position:fixed;inset:0;background:rgba(20,14,6,.68);display:none;align-items:center;justify-content:center;z-index:10;padding:20px;overflow:hidden}
#win .card{position:relative;background:var(--grain),linear-gradient(165deg,#2f2013,#1c130c);border-radius:20px;padding:30px 26px 24px;text-align:center;max-width:280px;width:100%;
 box-shadow:0 16px 40px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,220,160,.15);color:#fff8ea}
#win .crown{font-size:1.7rem;margin-bottom:2px}
#win h2{margin:0 0 14px;font-size:1.5rem;letter-spacing:.12em;color:#ffd98a;text-shadow:0 2px 10px rgba(0,0,0,.5)}
#win .statbox{display:flex;justify-content:center;gap:22px;background:rgba(0,0,0,.25);border-radius:12px;padding:12px 10px;margin-bottom:10px}
#win .stat .n{font-size:1.25rem;font-weight:700;color:#fff8ea}
#win .stat .l{font-size:.62rem;letter-spacing:.12em;opacity:.65;margin-top:2px}
#win .newbest{display:inline-block;font-size:.68rem;letter-spacing:.08em;color:#2a1e10;background:linear-gradient(160deg,#ffe9a8,#e0ab55);
 padding:4px 12px;border-radius:999px;font-weight:700;margin-bottom:6px}
#win p.sub2{margin:0 0 14px;font-size:.72rem;opacity:.65}
#win .confetti{position:absolute;top:-10px;border-radius:1px;opacity:.9;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translateY(340px) rotate(220deg);opacity:0}}
.winbtns{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
#win button.ghost{color:#e9d3ab;text-decoration:underline}
</style>
</head>

const PAGE_SIZE=12;

const $=id=>document.getElementById(id);
const board=$('board');

/* ---- sound ---- */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tock(){
  if(mute)return;const a=ac();if(!a)return;const t=a.currentTime;
  const o=a.createOscillator(),g=a.createGain();o.type='triangle';
  o.frequency.setValueAtTime(240,t);o.frequency.exponentialRampToValueAtTime(90,t+.09);
  g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+.13);
  const len=Math.floor(a.sampleRate*.03),buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=a.createBufferSource(),f=a.createBiquadFilter(),g2=a.createGain();
  s.buffer=buf;f.type='bandpass';f.frequency.value=1300;g2.gain.value=.3;
  s.connect(f).connect(g2).connect(a.destination);s.start(t);
}
function chime(){
  if(mute)return;const a=ac();if(!a)return;
  [523,659,784,1047].forEach((fr,i)=>{
    const t=a.currentTime+i*.11,o=a.createOscillator(),g=a.createGain();
    o.type='sine';o.frequency.value=fr;g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.5);
    o.connect(g).connect(a.destination);o.start(t);o.stop(t+.55);
  });
}
function muteLabel(){}
function showToast(msg){const t=$('titleToast');t.textContent=msg;t.classList.add('show');clearTimeout(showToast._h);showToast._h=setTimeout(()=>t.classList.remove('show'),1400)}

/* ---- storage ---- */
function getBest(i){try{const v=localStorage.getItem('wood-puzzle-best2-'+i);return v?parseInt(v,10):null}catch(e){return null}}
function setBest(i,v){try{const c=getBest(i);if(c===null||v<c)localStorage.setItem('wood-puzzle-best2-'+i,String(v))}catch(e){}}

/* ---- level select ---- */
function starCount(best,ref){
  if(best==null)return 0;
  if(best<=ref)return 3;
  if(best<=ref*1.15)return 2;
  return 1;
}
function starsHTML(n){
  let h='';
  for(let i=0;i<3;i++)h+=`<span class="${i<n?'on':''}">★</span>`;
  return h;
}
function buildLevelGrid(){
  const g=$('lvGrid');g.innerHTML='';
  const start=page*PAGE_SIZE,end=Math.min(LEVELS.length,start+PAGE_SIZE);
  for(let i=start;i<end;i++){
    const lv=LEVELS[i],b=getBest(i),n=starCount(b,lv.ref),c=document.createElement('div');c.className='lvCard';
    c.innerHTML=`<div class="lvnum">${String(i+1).padStart(2,'0')}</div><div class="lvstars">${starsHTML(n)}</div>`;
    c.addEventListener('click',()=>startLevel(i));g.appendChild(c);
  }
  if(end===start){
    const p=document.createElement('p');p.className='sub';p.style.gridColumn='1/-1';p.style.color='#e9d3ab';
    p.textContent='ここから先は準備中だよ';g.appendChild(p);
  }
  $('prevPageBtn').classList.toggle('hide',page===0);
  $('nextPageBtn').classList.toggle('hide',page>=PAGES-1);
  $('pageLabel').textContent=(page+1)+' / '+PAGES;
}
$('prevPageBtn').addEventListener('click',()=>{page=Math.max(0,page-1);buildLevelGrid()});
$('nextPageBtn').addEventListener('click',()=>{if(page<PAGES-1){page++;buildLevelGrid()}});
$('backHomeBtn').addEventListener('click',()=>{$('levelSelect').style.display='none';$('titleScreen').style.display='block'});
$('settingsGearBtn').addEventListener('click',()=>{ac();mute=!mute;try{localStorage.setItem('wood-mute',mute?'1':'0')}catch(e){}
  $('settingsGearBtn').textContent=mute?'⚙':'⚙';if(!mute)tock();
  $('settingsGearBtn').style.opacity=mute?'.55':'1'});
function startLevel(i){
  cur=i;$('levelSelect').style.display='none';$('gameScreen').style.display='flex';
  $('lvTitle').textContent='Lv.'+(i+1)+'（最小 '+LEVELS[i].ref+'手）';resetGame();
  if(window.showBannerAd)showBannerAd(); // bottom banner stays up during play too
}
function backToList(){$('gameScreen').style.display='none';$('levelSelect').style.display='flex';buildLevelGrid();
  if(window.showBannerAd)showBannerAd();}

/* ---- board ---- */
const clone=a=>a.map(p=>({...p}));
function occupied(excl){
  const g=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  pieces.forEach(p=>{if(p.id===excl)return;
    for(let dy=0;dy<p.h;dy++)for(let dx=0;dx<p.w;dx++){const y=p.y+dy,x=p.x+dx;if(y>=0&&y<ROWS&&x>=0&&x<COLS)g[y][x]=p.id}});
  return g;
}
function curExit(){return LEVELS[cur].exit||{side:'D',pos:1}}
function validStep(p,nx,ny){
  const ex=curExit(),g=occupied(p.id);
  for(let dy=0;dy<p.h;dy++)for(let dx=0;dx<p.w;dx++){
    const y=ny+dy,x=nx+dx;
    if(y>=ROWS){if(p.id==='target'&&ex.side==='D'&&nx===ex.pos)continue;return false}
    if(y<0){if(p.id==='target'&&ex.side==='U'&&nx===ex.pos)continue;return false}
    if(x>=COLS){if(p.id==='target'&&ex.side==='R'&&ny===ex.pos)continue;return false}
    if(x<0){if(p.id==='target'&&ex.side==='L'&&ny===ex.pos)continue;return false}
    if(g[y][x])return false;
  }
  return true;
}
function limits(p){
  const r={};
  for(const[k,dx,dy]of[['l',-1,0],['r',1,0],['u',0,-1],['d',0,1]]){
    let n=0,x=p.x,y=p.y;while(validStep(p,x+dx,y+dy)){x+=dx;y+=dy;n++}r[k]=n;
  }
  return r;
}
function place(el,p,ox=0,oy=0){el.style.left=(p.x*CELL+3+ox)+'px';el.style.top=(p.y*CELL+3+oy)+'px'}
function buildExit(){
  board.querySelectorAll('.exit').forEach(e=>e.remove());
  const ex=curExit(),el=document.createElement('div');
  el.className='exit side-'+ex.side;
  if(ex.side==='D'||ex.side==='U'){el.style.width=(2*CELL)+'px';el.style.left=(ex.pos*CELL)+'px'}
  else{el.style.height=(2*CELL)+'px';el.style.top=(ex.pos*CELL)+'px'}
  board.appendChild(el);
}
function build(){
  board.querySelectorAll('.piece').forEach(e=>e.remove());els={};buildExit();
  pieces.forEach(p=>{
    const el=document.createElement('div');
    el.className='piece';
    el.dataset.k=p.id==='target'?'t':p.w*p.h===1?'s':p.w>p.h?'h':'v';
    el.style.width=(p.w*CELL-6)+'px';el.style.height=(p.h*CELL-6)+'px';
    if(p.id==='target')el.textContent='娘';
    el.addEventListener('pointerdown',e=>onDown(e,p.id,el));
    el.addEventListener('pointermove',onMove);
    el.addEventListener('pointerup',onUp);
    el.addEventListener('pointercancel',onUp);
    els[p.id]=el;board.appendChild(el);
  });
}
function render(){pieces.forEach(p=>place(els[p.id],p));$('moves').textContent=moves}

/* ---- drag ---- */
function onDown(e,id,el){
  if(busy||drag)return;ac();
  const p=pieces.find(x=>x.id===id);
  drag={id,el,sx:e.clientX,sy:e.clientY,lim:limits(p),axis:null,off:0};
  el.setPointerCapture(e.pointerId);el.classList.add('drag');
}
function onMove(e){
  if(!drag)return;const d=drag,dx=e.clientX-d.sx,dy=e.clientY-d.sy,p=pieces.find(x=>x.id===d.id);
  if(!d.axis){
    if(Math.max(Math.abs(dx),Math.abs(dy))<6)return;
    let ax=Math.abs(dx)>=Math.abs(dy)?'x':'y';
    const can=a=>a==='x'?d.lim.l+d.lim.r>0:d.lim.u+d.lim.d>0;
    if(!can(ax))ax=ax==='x'?'y':'x';
    if(!can(ax))return;d.axis=ax;
  }
  const x=d.axis==='x',v=x?dx:dy;
  d.off=Math.max(-(x?d.lim.l:d.lim.u)*CELL,Math.min((x?d.lim.r:d.lim.d)*CELL,v));
  place(d.el,p,x?d.off:0,x?0:d.off);
}
function onUp(){
  if(!drag)return;const d=drag;drag=null;d.el.classList.remove('drag');
  const p=pieces.find(x=>x.id===d.id),n=d.axis?Math.round(d.off/CELL):0;
  if(!n){place(d.el,p);return}
  history.push(clone(pieces));
  if(d.axis==='x')p.x+=n;else p.y+=n;
  moves++;place(d.el,p);$('moves').textContent=moves;tock();checkWin();
}

function checkWin(){
  const t=pieces.find(x=>x.id==='target'),ex=curExit();
  const done=
    (ex.side==='D'&&t.x===ex.pos&&t.y===ROWS-t.h)||
    (ex.side==='U'&&t.x===ex.pos&&t.y===0)||
    (ex.side==='R'&&t.y===ex.pos&&t.x===COLS-t.w)||
    (ex.side==='L'&&t.y===ex.pos&&t.x===0);
  if(done){
    busy=true;
    setTimeout(()=>{
      if(ex.side==='D')t.y=ROWS;else if(ex.side==='U')t.y=-t.h;
      else if(ex.side==='R')t.x=COLS;else t.x=-t.w;
      render();chime();
      setTimeout(()=>{
        const prevBest=getBest(cur);
        setBest(cur,moves);
        const best=getBest(cur),isNew=(prevBest===null||moves<prevBest);
        $('statMoves').textContent=moves;
        $('statBest').textContent=best;
        $('statPar').textContent='最小手数: '+LEVELS[cur].ref+'手';
        $('newBestTag').style.display=isNew?'inline-block':'none';
        $('nextBtn').style.display=cur<LEVELS.length-1?'inline-block':'none';
        spawnConfetti();
        $('win').style.display='flex';
      },300)},120);
  }
}
function spawnConfetti(){
  const card=$('winCard'),cols=['#e0ab55','#b0503a','#6f8b5e','#fff8ea','#8a6238'];
  for(let i=0;i<22;i++){
    const s=document.createElement('div');s.className='confetti';
    s.style.left=(Math.random()*100)+'%';
    s.style.width=s.style.height=(4+Math.random()*4)+'px';
    s.style.background=cols[i%cols.length];
    s.style.animationDelay=(Math.random()*.3)+'s';
    s.style.animationDuration=(1+Math.random()*.8)+'s';
    card.appendChild(s);
    setTimeout(()=>s.remove(),2200);
  }
}
function resetGame(){sizeBoard();pieces=clone(LEVELS[cur].pieces);moves=0;history=[];busy=false;build();render()}
let resizeT;
window.addEventListener('resize',()=>{clearTimeout(resizeT);resizeT=setTimeout(()=>{
  if($('gameScreen').style.display!=='none'&&pieces){sizeBoard();build();render()}
},150)});

$('undoBtn').addEventListener('click',()=>{if(busy||!history.length)return;pieces=history.pop();moves=Math.max(0,moves-1);render();
  if(window.maybeShowInterstitialOnUndo)maybeShowInterstitialOnUndo();});
$('resetBtn').addEventListener('click',resetGame);
$('backBtn').addEventListener('click',backToList);
$('retryBtn').addEventListener('click',()=>{if(window.showInterstitialOnClear)showInterstitialOnClear();$('win').style.display='none';resetGame()});
$('nextBtn').addEventListener('click',()=>{if(window.showInterstitialOnClear)showInterstitialOnClear();$('win').style.display='none';startLevel(Math.min(cur+1,LEVELS.length-1))});
$('toListBtn').addEventListener('click',()=>{if(window.showInterstitialOnClear)showInterstitialOnClear();$('win').style.display='none';backToList()});
buildLevelGrid();
$('settingsGearBtn').style.opacity=mute?'.55':'1';
$('titleScreen').addEventListener('click',()=>{ac();$('titleScreen').style.display='none';$('levelSelect').style.display='flex';
  if(window.showBannerAd)showBannerAd();});
if(window.initAds)initAds();
</script>
